<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسبة</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>حسبة</h1>
      <p>حاسبة الشدة</p>
    </header>

    <main>
      <div class="card">
        <h2>الحسبة</h2>

        <input id="number1" type="number" placeholder="الرقم الأول">

        <select id="operation">
          <option value="+">جمع +</option>
          <option value="-">طرح −</option>
          <option value="*">ضرب ×</option>
          <option value="/">قسمة ÷</option>
        </select>

        <input id="number2" type="number" placeholder="الرقم الثاني">

        <button onclick="calculate()">احسب</button>

        <div id="result">النتيجة: 0</div>
      </div>
    </main>

    <footer>
      <p>© حسبة</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
