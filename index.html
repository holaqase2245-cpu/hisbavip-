<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b10">
  <title>حسبة</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="fireworks"></div>

<div class="app">

  <!-- الرئيسية -->
  <section id="home" class="screen active">

    <header class="top">
      <button class="icon-btn" onclick="clickSound()">☰</button>

      <div class="logo">
        <span>♛</span>
        <h1>حسبة</h1>
        <small>سجل نقاطك .. وخلك أحلى</small>
      </div>

      <button class="icon-btn" onclick="showScreen('settings')">⚙</button>
    </header>

    <div class="home-content">

      <p class="subtitle">اختر نوع اللعبة وابدأ التسجيل</p>

      <button class="game-card" onclick="newGame('ورق')">
        <div class="game-icon">🂡</div>
        <div>
          <h2>لعبة الورق</h2>
          <p>تسجيل نقاط لعبة الورق</p>
        </div>
        <b>‹</b>
      </button>

      <button class="game-card" onclick="newGame('دومينو')">
        <div class="game-icon">🎲</div>
        <div>
          <h2>الدومينو</h2>
          <p>تسجيل نقاط الدومينو</p>
        </div>
        <b>‹</b>
      </button>

      <h3 class="section-title">الألعاب السابقة</h3>

      <div id="historyHome"></div>

    </div>

    <nav class="bottom-nav">
      <button class="selected" onclick="showScreen('home')">
        <span>⌂</span>الرئيسية
      </button>
      <button onclick="showHistory()">
        <span>▤</span>الألعاب السابقة
      </button>
      <button onclick="showScreen('settings')">
        <span>⚙</span>الإعدادات
      </button>
    </nav>

  </section>


  <!-- إنشاء لعبة -->
  <section id="setup" class="screen">

    <header class="page-header">
      <button onclick="showScreen('home')">‹</button>
      <h2>إنشاء لعبة جديدة</h2>
      <span></span>
    </header>

    <div class="content">

      <div class="game-switch">
        <button id="paperBtn" class="active" onclick="selectGame('ورق')">ورق</button>
        <button id="dominoBtn" onclick="selectGame('دومينو')">دومينو</button>
      </div>

      <h3>👥 إضافة اللاعبين</h3>

      <div id="players"></div>

      <button class="add-player" onclick="addPlayer()">＋ إضافة لاعب</button>

      <h3>عدد الجولات</h3>

      <div class="rounds">
        <button onclick="setRounds(3)">3</button>
        <button class="active" onclick="setRounds(5)">5</button>
        <button onclick="setRounds(7)">7</button>
      </div>

      <button class="main-btn" onclick="startGame()">
        ابدأ اللعبة ▶
      </button>

    </div>

  </section>


  <!-- الجولة -->
  <section id="game" class="screen">

    <header class="page-header">
      <button onclick="showScreen('home')">‹</button>
      <h2 id="roundTitle">الجولة الأولى</h2>
      <button>◷</button>
    </header>

    <div class="round-number" id="roundNumber">1 / 5</div>

    <div id="scorePlayers"></div>

    <div class="notice">
      ⓘ <span>أدخل نقاط اللاعبين ثم احفظ الجولة</span>
    </div>

    <div class="game-actions">
      <button class="secondary-btn" onclick="resetRound()">↻ إعادة</button>
      <button class="main-btn small" onclick="saveRound()">✓ حفظ الجولة</button>
    </div>

  </section>


  <!-- الملخص -->
  <section id="summary" class="screen">

    <header class="page-header">
      <button onclick="showScreen('home')">⌂</button>
      <h2>ملخص اللعبة</h2>
      <span></span>
    </header>

    <div class="winner-box">
      <div class="crown">♛</div>
      <h2>الفائز</h2>
      <div id="winnerName">أحمد</div>
      <strong id="winnerScore">0</strong>
    </div>

    <div id="finalScores"></div>

    <button class="main-btn" onclick="newGame(currentGameType)">
      لعبة جديدة
    </button>

    <button class="secondary-btn full" onclick="showScreen('home')">
      العودة للرئيسية ⌂
    </button>

  </section>


  <!-- الألعاب السابقة -->
  <section id="history" class="screen">

    <header class="page-header">
      <button onclick="showScreen('home')">‹</button>
      <h2>الألعاب السابقة</h2>
      <span>◷</span>
    </header>

    <div class="tabs">
      <button class="active">جميع الألعاب</button>
      <button>لعبة الورق</button>
      <button>الدومينو</button>
    </div>

    <div id="historyList"></div>

    <button class="delete-btn" onclick="deleteHistory()">
      🗑 حذف جميع الألعاب
    </button>

  </section>


  <!-- الإعدادات -->
  <section id="settings" class="screen">

    <header class="page-header">
      <button onclick="showScreen('home')">‹</button>
      <h2>الإعدادات</h2>
      <span>⚙</span>
    </header>

    <div class="settings-list">

      <button>
        <span>🌙</span>
        <div>
          <b>المظهر</b>
          <small>الوضع الداكن</small>
        </div>
        <i>›</i>
      </button>

      <button>
        <span>🎴</span>
        <div>
          <b>إعدادات اللعبة</b>
          <small>عدد الجولات ونوع اللعبة</small>
        </div>
        <i>›</i>
      </button>

      <button>
        <span>📁</span>
        <div>
          <b>إدارة الألعاب</b>
          <small>حفظ / استعادة / حذف</small>
        </div>
        <i>›</i>
      </button>

      <button>
        <span>🌐</span>
        <div>
          <b>اللغة</b>
          <small>العربية</small>
        </div>
        <i>›</i>
      </button>

      <button>
        <span>ⓘ</span>
        <div>
          <b>حول التطبيق</b>
          <small>حسبة - الإصدار 1.0.0</small>
        </div>
        <i>›</i>
      </button>

    </div>

  </section>

</div>

<canvas id="fireworksCanvas"></canvas>

<script src="script.js"></script>

</body>
</html>
