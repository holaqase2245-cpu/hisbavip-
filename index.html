<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة</title>
</head>
<body>

  <h1>حاسبة</h1>

  <input type="number" id="num1" placeholder="الرقم الأول">
  <input type="number" id="num2" placeholder="الرقم الثاني">

  <button onclick="calculate('+')">+</button>
  <button onclick="calculate('-')">−</button>
  <button onclick="calculate('*')">×</button>
  <button onclick="calculate('/')">÷</button>

  <h2 id="result">النتيجة: 0</h2>

  <script>
    function calculate(operator) {
      let a = Number(document.getElementById("num1").value);
      let b = Number(document.getElementById("num2").value);
      let result;

      if (operator === "+") result = a + b;
      if (operator === "-") result = a - b;
      if (operator === "*") result = a * b;
      if (operator === "/") result = b !== 0 ? a / b : "لا يمكن القسمة على صفر";

      document.getElementById("result").innerText = "النتيجة: " + result;
    }
  </script>

</body>
</html>
